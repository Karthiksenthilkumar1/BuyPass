version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: buypass_db
    environment:
      POSTGRES_USER: buypass
      POSTGRES_PASSWORD: password
      POSTGRES_DB: buypass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buypass_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
